name: Release

# Builds the launcher + mod, runs the tests, and publishes a GitHub release with
# the Windows zip (launcher .exe + manual install) and the Linux AppImage (any distro / Steam Deck).
# Run it from the Actions tab (Run workflow) or push a tag like v0.5.6.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test build: publish as a pre-release (vX-test), not the latest version"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' src/SubnauticaMP.Plugin/SubnauticaMP.Plugin.csproj)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.test }}" = "true" ]; then echo "tag=v$v-test" >> "$GITHUB_OUTPUT"; else echo "tag=v$v" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        run: dotnet test -c Release

      - name: Build
        run: |
          dotnet build src/SubnauticaMP.Plugin -c Release
          dotnet build src/SubnauticaMP.Optimizer -c Release
          dotnet publish src/SubnauticaMP.Launcher -c Release -r win-x64 -o publish
          dotnet publish src/SubnauticaMP.Launcher -c Release -r linux-x64 -o publish-linux

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          d="SubnauticaMP-v$v"
          mkdir -p "$d/manual-install/BepInEx/plugins/SubnauticaMP" "$d/manual-install/BepInEx/plugins/SubnauticaOptimizer"
          cp publish/SubnauticaMP-Launcher.exe publish/*.dll "$d/"  # the launcher + the graphics DLLs it needs next to it
          cp src/SubnauticaMP.Plugin/bin/Release/SubnauticaMP.dll src/SubnauticaMP.Plugin/bin/Release/Mono.Nat.dll "$d/manual-install/BepInEx/plugins/SubnauticaMP/"
          cp src/SubnauticaMP.Optimizer/bin/Release/SubnauticaOptimizer.dll "$d/manual-install/BepInEx/plugins/SubnauticaOptimizer/"
          cp docs/READ_ME.txt "$d/READ ME.txt"
          sed -i "s/{VERSION}/$v/" "$d/READ ME.txt"
          zip -qr9 "$d-Windows.zip" "$d"
          tools/appimage/build.sh publish-linux "$v" "$d-Linux-x86_64.AppImage"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Subnautica Multiplayer ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ inputs.test != true }}
          prerelease: ${{ inputs.test == true }}
          files: |
            SubnauticaMP-v${{ steps.version.outputs.version }}-Windows.zip
            SubnauticaMP-v${{ steps.version.outputs.version }}-Linux-x86_64.AppImage
          body: |
            **Windows:** download `SubnauticaMP-v${{ steps.version.outputs.version }}-Windows.zip` below, extract it, run `SubnauticaMP-Launcher.exe`.

            **Linux / Steam Deck:** download `SubnauticaMP-v${{ steps.version.outputs.version }}-Linux-x86_64.AppImage`, make it executable
            (right-click > Properties > Allow executing, or `chmod +x`), run it. Works on any distro. In Steam set Subnautica's launch option once:
            `WINEDLLOVERRIDES="winhttp=n,b" %command%` (the launcher's Setup page has a Copy button for it).

            The top-right of the launcher should say v${{ steps.version.outputs.version }}. Hit PLAY: it installs / updates the mod and starts the game.
            Everyone playing together needs the same version.
